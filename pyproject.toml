[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-outo"
version = "0.2.0"
description = "Let AI agents drive a user's real browser via a browser extension connected outbound over WebSocket."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "llaa33219" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "click",
    "httpx",
]

[project.scripts]
browser-outo = "browser_outo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/browser_outo"]

[tool.hatch.build.targets.sdist]
include = ["src/browser_outo"]
